# Locust reads this file from the directory it is started in (the run scripts cd here).
# Only settings that were the same in every reported run live here.
# Users, spawn rate and run time differ per run: pass them as flags
# (see "Reported run parameters" in docs/environment.md).
locustfile = chat_load.py

# Think time: seconds each user pauses between getting a response and sending the next request.
# 0 = closed loop: every user fires again immediately, so N users means about N requests
# always in flight. Load is set by the user count and how fast the system answers.
# All reported runs used 0. A non-zero value lowers RPS for the same user count, so those
# results would not be comparable with the report. A slow response also delays that user's
# next request, so tail latency may be understated (coordinated omission).
think-time = 0
